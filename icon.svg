<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- MotionFit mark: dark navy card, orange heartbeat trace (the app palette). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b2c"/>
      <stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="24" fill="url(#bg)" stroke="#2a3348" stroke-width="2"/>
  <!-- soft glow under the trace -->
  <path d="M16 72 H42 L52 46 L66 96 L78 54 L86 72 H112" fill="none"
        stroke="#ff8024" stroke-opacity="0.28" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the trace itself -->
  <path d="M16 72 H42 L52 46 L66 96 L78 54 L86 72 H112" fill="none"
        stroke="#ff8024" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pulse dot at the trace's end -->
  <circle cx="112" cy="72" r="6.5" fill="#ffd9b3"/>
</svg>
